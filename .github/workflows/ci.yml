name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit tests
        run: mvn -B test
        working-directory: backend
      - name: Package
        run: mvn -B -DskipTests package
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: laminar-ops-backend
          path: backend/target/laminar-ops-1.0.0.jar

  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web-admin
      - name: Unit tests
        run: npm run test:unit
        working-directory: web-admin
      - name: Build admin
        run: npm run build
        working-directory: web-admin
      - name: Build portal
        run: npm run build:portal
        working-directory: web-admin
      - uses: actions/upload-artifact@v4
        with:
          name: laminar-ops-frontend
          path: |
            web-admin/dist
            web-admin/dist-portal

  integration:
    name: API integration smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laminar_ops
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build backend
        run: mvn -B -DskipTests package
        working-directory: backend
      - name: Start backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/laminar_ops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root
          JWT_SECRET: github-actions-jwt-secret-please-change-2026
          CONFIG_SECRET: github-actions-config-secret-please-change-2026
          FILE_SIGN_SECRET: github-actions-file-secret-please-change-2026
          MONITOR_TOKEN: github-actions-monitor-token
          VERIFICATION_DEV_MODE: 'false'
          UPLOAD_DIR: ${{ github.workspace }}/upload
        run: |
          mkdir -p upload
          nohup java -jar target/laminar-ops-1.0.0.jar > app.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/actuator/health
        working-directory: backend
      - name: Prepare test admin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client
          mysql -h127.0.0.1 -uroot -proot laminar_ops -e "update sys_user set must_change_pwd=0 where username='admin';"
      - name: Run API smoke
        env:
          API_BASE: http://127.0.0.1:8080
          TEST_USERNAME: admin
          TEST_PASSWORD: Laminar@2026
          TEST_COMPANY_CODE: ''
        run: node tools/api-smoke-test.mjs
      - name: Show backend log on failure
        if: failure()
        run: tail -200 backend/app.log

  e2e:
    name: Frontend E2E login to acceptance
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laminar_ops
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web-admin
      - name: Build frontend
        run: |
          npm run build
          npm run build:portal
        working-directory: web-admin
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web-admin
      - name: Build backend
        run: mvn -B -DskipTests package
        working-directory: backend
      - name: Install MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client
      - name: Start backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/laminar_ops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root
          JWT_SECRET: github-actions-jwt-secret-please-change-2026
          CONFIG_SECRET: github-actions-config-secret-please-change-2026
          FILE_SIGN_SECRET: github-actions-file-secret-please-change-2026
          MONITOR_TOKEN: github-actions-monitor-token
          VERIFICATION_DEV_MODE: 'false'
          UPLOAD_DIR: ${{ github.workspace }}/upload
        run: |
          mkdir -p upload
          nohup java -jar target/laminar-ops-1.0.0.jar > app.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/actuator/health
        working-directory: backend
      - name: Run E2E
        env:
          E2E_BROWSER_CHANNEL: chromium
          MYSQL_BIN: mysql
          MYSQL_ROOT_PASSWORD: root
        run: npx playwright test --reporter=list
        working-directory: web-admin
      - name: Run screenshot regression when Linux baseline exists
        env:
          CI: 'false'
          E2E_BROWSER_CHANNEL: chromium
          MYSQL_BIN: mysql
          MYSQL_ROOT_PASSWORD: root
        run: |
          if compgen -G "tests/e2e/__screenshots__/**/*-linux.png" > /dev/null; then
            npx playwright test tests/e2e/visual.spec.mjs tests/e2e/file-check-visual.spec.mjs --reporter=list
          else
            echo "Linux screenshot baseline not generated yet; run Visual Baseline (Linux) workflow."
          fi
        working-directory: web-admin
      - name: Cleanup E2E data
        if: always()
        env:
          MYSQL_BIN: mysql
          MYSQL_ROOT_PASSWORD: root
        run: node e2e/cleanup.mjs || true
      - name: Show backend log on failure
        if: failure()
        run: tail -200 backend/app.log
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web-admin/playwright-report
            web-admin/test-results

